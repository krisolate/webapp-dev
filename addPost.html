<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Post</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link active" href="addPost.html">Add Post</a>
      <a class="profile-link" href="login.html" aria-label="Log in">
        <span class="profile-icon" aria-hidden="true">Login</span>
      </a>
    </nav>
  </header>

  <main class="form-page">
    <form class="form-card" action="index.html" method="get">
      <label for="post-body">Post body</label>
      <textarea id="post-body" name="postBody" placeholder="textarea" required></textarea>

      <label for="post-image">Select file</label>
      <input id="post-image" name="postImage" type="file" accept="image/*">

      <button class="primary-button" type="submit">Create post</button>
    </form>
  </main>
</body>
</html>
