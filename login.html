<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="addPost.html">Add Post</a>
      <a class="profile-link" href="login.html" aria-label="Log in">
        <span class="profile-icon" aria-hidden="true">Login</span>
      </a>
    </nav>
  </header>

  <main class="form-page">
    <section class="form-card login-card" aria-labelledby="welcome-heading">
      <h1 id="welcome-heading">Welcome to PostIt</h1>
      <a class="text-link" href="#create-account">Create an account</a>
      <p class="or-text">or</p>
      <p class="login-prompt">Please log in</p>

      <form action="index.html" method="get">
        <label class="visually-hidden" for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>

        <label class="visually-hidden" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>

        <button class="primary-button" type="submit">Log in</button>
      </form>
      <a class="text-link forgot-link" href="#forgot-password">Forget password</a>
    </section>
  </main>
</body>
</html>
